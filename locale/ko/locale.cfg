[mod-setting-description]
rq-pause-game=연구 대기열 창이 열려 있는 동안 게임을 일시 정지합니다. 싱글플레이에서만 작동합니다.
rq-mirror-vanilla-queue=확장 대기열의 처음 4개 항목을 게임의 연구 대기열에 복사하고, 그곳에서 이루어진 변경을 다시 읽어옵니다. 끄면 확장 대기열은 계획용 목록으로만 쓰이고 게임의 대기열은 건드리지 않습니다.

