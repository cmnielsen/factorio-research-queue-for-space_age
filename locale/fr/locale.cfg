[mod-setting-description]
rq-pause-game=Met le jeu en pause tant que la fenêtre de la file de recherche est ouverte. Fonctionne uniquement en solo.
rq-mirror-vanilla-queue=Copie les 4 premières entrées de la file étendue dans la file de recherche du jeu et relit les modifications faites à cet endroit. Désactivé, la file étendue sert uniquement de liste de planification et la file du jeu n'est pas touchée.

