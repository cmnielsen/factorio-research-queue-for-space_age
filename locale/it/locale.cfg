rq-mirror-vanilla-queue=Copia le prime 4 voci della coda estesa nella coda di ricerca del gioco e rilegge le modifiche fatte lì. Se disattivato, la coda estesa è solo un elenco di pianificazione e la coda del gioco non viene toccata.

