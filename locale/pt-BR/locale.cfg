[mod-setting-description]
rq-pause-game=Pausa o jogo enquanto a janela da fila de pesquisa estiver aberta. Só funciona em jogo solo.
rq-mirror-vanilla-queue=Copia as 4 primeiras entradas da fila estendida para a fila de pesquisa do jogo e lê de volta as alterações feitas lá. Desativado, a fila estendida é só uma lista de planejamento e a fila do jogo não é tocada.

