[mod-setting-description]
rq-pause-game=Pausiert das Spiel, solange das Fenster der Forschungswarteschlange offen ist. Funktioniert nur im Einzelspielermodus.
rq-mirror-vanilla-queue=Kopiert die ersten 4 Einträge der erweiterten Warteschlange in die Forschungswarteschlange des Spiels und liest dortige Änderungen zurück. Ist die Option aus, dient die erweiterte Warteschlange nur als Planungsliste und die Warteschlange des Spiels bleibt unberührt.

