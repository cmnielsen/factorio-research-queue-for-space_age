[mod-name]
factorio-research-queue-for-space_age=Extended Research Queue

[mod-description]
factorio-research-queue-for-space_age=An improved GUI for managing the research queue, with filtering, translated search, queue controls and research time estimates. Inspired by the earlier mods Extended Research Queue (sh4dow) and Research Queue (sonaxaton).

[shortcut-name]
factorio-research-queue=Open Research Queue GUI

[controls]
rq-toggle-main-window=Open Research Queue GUI
rq-focus-search=Focus search field

[mod-setting-name]
rq-pause-game=Pause game while window is open
rq-mirror-vanilla-queue=Mirror queue to the vanilla research queue

[mod-setting-description]
rq-pause-game=Pause the game while the research queue window is open. Only works in single player.
rq-mirror-vanilla-queue=Copies the first 4 entries of the extended queue into the game's own research queue and reads changes made there back. When disabled, the extended queue is only a planning list and the vanilla queue is left alone.

