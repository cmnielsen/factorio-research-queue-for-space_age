[mod-setting-description]
rq-pause-game=研究队列窗口打开时暂停游戏。仅在单人游戏中有效。
rq-mirror-vanilla-queue=将扩展队列的前 4 项复制到游戏自带的研究队列，并读回在那里所做的更改。关闭后，扩展队列仅作为规划列表，游戏自带的队列不会被改动。

